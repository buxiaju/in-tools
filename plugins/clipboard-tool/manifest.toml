[plugin]
id = "com.intools.clipboard"
name = "剪贴板工具"
version = "0.1.0"
author = "InTools"
description = "读取和写入系统剪贴板的文本内容，提供剪贴板历史记录"

[exec]
command = "python"
args = ["-u", "main.py"]

[[tools]]
name = "clipboard:read_text"
description = "读取系统剪贴板中的纯文本内容。如果剪贴板中不是文本则返回空"
[tools.input_schema]
type = "object"

[[tools]]
name = "clipboard:write_text"
description = "将指定文本写入系统剪贴板，覆盖原有内容"
[tools.input_schema]
type = "object"
required = ["text"]
[tools.input_schema.properties.text]
type = "string"
description = "要写入剪贴板的文本内容"

[[tools]]
name = "clipboard:append_text"
description = "将文本追加到剪贴板现有内容之后（如果原有内容不是文本则直接覆盖）"
[tools.input_schema]
type = "object"
required = ["text"]
[tools.input_schema.properties.text]
type = "string"
description = "要追加的文本"
[tools.input_schema.properties.separator]
type = "string"
description = "原有内容与追加内容之间的分隔符，默认换行符"

[[tools]]
name = "clipboard:clear"
description = "清空系统剪贴板"
[tools.input_schema]
type = "object"

[[tools]]
name = "clipboard:has_text"
description = "检查剪贴板中当前是否包含文本内容"
[tools.input_schema]
type = "object"

[capabilities]
permissions = ["clipboard:read", "clipboard:write"]

[docs]
usage_file = "README.md"

[shortcut]
key = "Ctrl+Shift+V"
tool = "clipboard:read_text"
ui = "clipboard-history"

[lifecycle]
mode = "on-demand"
idle_timeout_sec = 120
restart_policy = "on-failure"
