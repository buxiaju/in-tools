name: Build Marketplace Index

on:
  push:
    branches: [master, main]
    paths:
      - 'plugins/**'
      - 'scripts/**'
      - '.github/workflows/build-marketplace-index.yml'
  schedule:
    # 每天凌晨 2 点运行一次
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build Marketplace Index
        run: |
          node scripts/build-marketplace-index.js

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './marketplace'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
